  <rect x="365" y="215" width="260" height="50" rx="6" class="soft" stroke="#005bd1"/>
  <text x="495" y="247" text-anchor="middle" class="sub blueText">P2.1: Module đọc cảm biến</text>
  <rect x="388" y="282" width="250" height="72" rx="5" class="soft" stroke="#005bd1"/>
  <rect x="400" y="295" width="24" height="24" rx="3" class="blue"/><text x="412" y="313" text-anchor="middle" class="tag">T3</text>
  <text x="520" y="308" text-anchor="middle" class="body"><tspan x="520" dy="0">Lập trình đọc</tspan><tspan x="520" dy="22">DHT22, Soil, LDR</tspan></text>
