  <rect x="48" y="850" width="250" height="50" rx="6" class="soft" stroke="#3b8f20"/>
  <text x="173" y="882" text-anchor="middle" class="sub greenText">P1.4: Module Solar Tracking</text>
  <rect x="70" y="915" width="230" height="62" rx="5" class="soft" stroke="#3b8f20"/>
  <rect x="82" y="927" width="24" height="24" rx="3" class="green"/><text x="94" y="945" text-anchor="middle" class="tag">T3</text>
  <text x="180" y="936" text-anchor="middle" class="body"><tspan x="180" dy="0">Lắp ráp tấm pin TP4056,</tspan><tspan x="180" dy="22">servo *2, LDR *4, relay *3</tspan></text>

