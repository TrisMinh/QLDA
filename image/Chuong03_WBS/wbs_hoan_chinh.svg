  <rect x="1372" y="300" width="46" height="24" rx="3" class="teal"/><text x="1395" y="318" text-anchor="middle" class="tag">T4_HW</text>
  <text x="1480" y="306" text-anchor="middle" class="body"><tspan x="1480" dy="0">Kiểm thử phần cứng</tspan><tspan x="1480" dy="22">và firmware</tspan></text>
  <rect x="1360" y="375" width="215" height="74" rx="5" class="soft" stroke="#07828a"/>
  <rect x="1372" y="390" width="46" height="24" rx="3" class="teal"/><text x="1395" y="408" text-anchor="middle" class="tag">T4_SW</text>
  <text x="1480" y="396" text-anchor="middle" class="body"><tspan x="1480" dy="0">Kiểm thử Backend,</tspan><tspan x="1480" dy="22">Web Dashboard và AI</tspan></text>
  <rect x="1330" y="520" width="245" height="50" rx="6" class="soft" stroke="#07828a"/>
  <text x="1452" y="552" text-anchor="middle" class="sub tealText">P5.2: Hiệu chỉnh</text>
  <rect x="1360" y="595" width="215" height="92" rx="5" class="soft" stroke="#07828a"/>
  <rect x="1372" y="612" width="24" height="24" rx="3" class="teal"/><text x="1384" y="630" text-anchor="middle" class="tag">T4</text>
  <text x="1480" y="620" text-anchor="middle" class="body"><tspan x="1480" dy="0">Hiệu chỉnh cảm biến,</tspan><tspan x="1480" dy="22">tune tham số MPC,</tspan><tspan x="1480" dy="22">sửa lỗi</tspan></text>
  <rect x="1330" y="720" width="245" height="50" rx="6" class="soft" stroke="#07828a"/>
  <text x="1452" y="752" text-anchor="middle" class="sub tealText">P5.3: Hoàn thành dự án</text>
  <rect x="1360" y="795" width="215" height="92" rx="5" class="soft" stroke="#07828a"/>
  <rect x="1372" y="812" width="24" height="24" rx="3" class="teal"/><text x="1384" y="830" text-anchor="middle" class="tag">T5</text>
  <text x="1480" y="820" text-anchor="middle" class="body"><tspan x="1480" dy="0">Demo hoàn chỉnh,</tspan><tspan x="1480" dy="22">báo cáo PBL + QLDA,</tspan><tspan x="1480" dy="22">slide, bảo vệ</tspan></text>
</svg>
