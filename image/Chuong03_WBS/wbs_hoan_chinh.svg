  <rect x="720" y="565" width="270" height="62" rx="5" class="soft" stroke="#f05a00"/>
  <rect x="732" y="577" width="24" height="24" rx="3" class="orange"/><text x="744" y="595" text-anchor="middle" class="tag">T1</text>
  <text x="858" y="590" text-anchor="middle" class="body"><tspan x="858" dy="0">Thu thập và xử lý dữ liệu</tspan><tspan x="858" dy="22">105, 120 mẫu</tspan></text>
  <rect x="720" y="635" width="270" height="62" rx="5" class="soft" stroke="#f05a00"/>
  <rect x="732" y="647" width="24" height="24" rx="3" class="orange"/><text x="744" y="665" text-anchor="middle" class="tag">T3</text>
  <text x="858" y="660" text-anchor="middle" class="body"><tspan x="858" dy="0">Huấn luyện ARX(5,1,2),</tspan><tspan x="858" dy="22">đánh giá FIT/RMSE</tspan></text>
  <rect x="690" y="715" width="300" height="50" rx="6" class="soft" stroke="#f05a00"/>
  <text x="840" y="747" text-anchor="middle" class="sub orangeText">P3.4: Kalman Filter</text>
  <rect x="720" y="780" width="270" height="62" rx="5" class="soft" stroke="#f05a00"/>
  <rect x="732" y="792" width="24" height="24" rx="3" class="orange"/><text x="744" y="810" text-anchor="middle" class="tag">T3</text>
  <text x="858" y="805" text-anchor="middle" class="body"><tspan x="858" dy="0">Phát triển Adaptive</tspan><tspan x="858" dy="22">Kalman Filter với IAE</tspan></text>
  <rect x="690" y="855" width="300" height="50" rx="6" class="soft" stroke="#f05a00"/>
  <text x="840" y="887" text-anchor="middle" class="sub orangeText">P3.5: MPC Controller</text>
  <rect x="720" y="920" width="270" height="62" rx="5" class="soft" stroke="#f05a00"/>
  <rect x="732" y="932" width="24" height="24" rx="3" class="orange"/><text x="744" y="950" text-anchor="middle" class="tag">T3</text>
  <text x="858" y="942" text-anchor="middle" class="body"><tspan x="858" dy="0">Phát triển hàm chi phí</tspan><tspan x="858" dy="22">Zone/Range, ràng buộc,</tspan><tspan x="858" dy="22">tối ưu</tspan></text>

