  <rect x="388" y="617" width="250" height="72" rx="5" class="soft" stroke="#005bd1"/>
  <rect x="400" y="630" width="24" height="24" rx="3" class="blue"/><text x="412" y="648" text-anchor="middle" class="tag">T3</text>
