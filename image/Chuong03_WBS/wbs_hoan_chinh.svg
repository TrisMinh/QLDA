  <rect x="1060" y="282" width="235" height="92" rx="5" class="soft" stroke="#6120a7"/>
  <rect x="1072" y="296" width="24" height="24" rx="3" class="purple"/><text x="1084" y="314" text-anchor="middle" class="tag">T3</text>
  <text x="1188" y="314" text-anchor="middle" class="body"><tspan x="1188" dy="0">Phát triển Dashboard,</tspan><tspan x="1188" dy="22">biểu đồ real-time,</tspan><tspan x="1188" dy="22">cảnh báo</tspan></text>
  <rect x="1035" y="405" width="260" height="50" rx="6" class="soft" stroke="#6120a7"/>
  <text x="1165" y="437" text-anchor="middle" class="sub purpleText">P4.2: Giao diện điều khiển</text>
  <rect x="1060" y="472" width="235" height="92" rx="5" class="soft" stroke="#6120a7"/>
  <rect x="1072" y="486" width="24" height="24" rx="3" class="purple"/><text x="1084" y="504" text-anchor="middle" class="tag">T3</text>
  <text x="1188" y="504" text-anchor="middle" class="body"><tspan x="1188" dy="0">Phát triển nút bật/tắt</tspan><tspan x="1188" dy="22">thiết bị, trạng thái</tspan><tspan x="1188" dy="22">tự động (Auto)</tspan></text>

  <!-- Column P5 -->
  <rect x="1305" y="130" width="270" height="54" rx="8" class="teal"/>
  <text x="1440" y="164" text-anchor="middle" class="head">P5: Kiểm thử</text>
