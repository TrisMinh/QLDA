<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #fff; }
      .head { font: 700 22px Arial, sans-serif; fill: #fff; }
      .sub { font: 700 18px Arial, sans-serif; }
      .body { font: 16px Arial, sans-serif; fill: #111; }
      .tag { font: 700 13px Arial, sans-serif; fill: #fff; }
      .line { stroke: #333; stroke-width: 2; fill: none; }
      .soft { fill: #f8fbff; stroke-width: 1.2; }
      .green { fill: #3b8f20; }
      .blue { fill: #005bd1; }
      .orange { fill: #f05a00; }
      .purple { fill: #6120a7; }
      .teal { fill: #07828a; }
      .greenText { fill: #2d7b18; }
      .blueText { fill: #005bd1; }
      .orangeText { fill: #f05a00; }
      .purpleText { fill: #6120a7; }
      .tealText { fill: #07828a; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#ffffff"/>

  <rect x="470" y="14" width="660" height="58" rx="8" class="blue"/>
  <text x="800" y="52" text-anchor="middle" class="title">HỆ THỐNG NHÀ KÍNH THÔNG MINH</text>

  <path d="M800 72 V108 M160 108 H1440 M160 108 V130 M460 108 V130 M810 108 V130 M1110 108 V130 M1440 108 V130" class="line"/>

  <!-- Column P1 -->
  <rect x="24" y="130" width="280" height="54" rx="8" class="green"/>
  <text x="164" y="164" text-anchor="middle" class="head">P1: Phần cứng</text>

  <path d="M24 156 H8 V900 H24 M8 240 H48 M8 520 H48 M8 690 H48 M8 850 H48" class="line"/>
  <rect x="48" y="215" width="250" height="50" rx="6" class="soft" stroke="#3b8f20"/>
  <text x="173" y="247" text-anchor="middle" class="sub greenText">P1.1: Module cảm biến</text>
  <rect x="70" y="282" width="230" height="62" rx="5" class="soft" stroke="#3b8f20"/>
  <rect x="82" y="294" width="24" height="24" rx="3" class="green"/><text x="94" y="312" text-anchor="middle" class="tag">T2</text>
  <text x="175" y="306" text-anchor="middle" class="body"><tspan x="175" dy="0">Thiết kế sơ đồ</tspan><tspan x="175" dy="22">kết nối cảm biến</tspan></text>
  <rect x="70" y="360" width="230" height="62" rx="5" class="soft" stroke="#3b8f20"/>
  <rect x="82" y="372" width="24" height="24" rx="3" class="green"/><text x="94" y="390" text-anchor="middle" class="tag">T3</text>
  <text x="178" y="384" text-anchor="middle" class="body"><tspan x="178" dy="0">Lắp ráp &amp; đấu nối</tspan><tspan x="178" dy="22">DHT22, Soil, LDR</tspan></text>
  <rect x="70" y="438" width="230" height="62" rx="5" class="soft" stroke="#3b8f20"/>
  <rect x="82" y="450" width="24" height="24" rx="3" class="green"/><text x="94" y="468" text-anchor="middle" class="tag">T4</text>
  <text x="178" y="462" text-anchor="middle" class="body"><tspan x="178" dy="0">Kiểm thử giá trị</tspan><tspan x="178" dy="22">cảm biến</tspan></text>

  <rect x="48" y="520" width="250" height="50" rx="6" class="soft" stroke="#3b8f20"/>
  <text x="173" y="552" text-anchor="middle" class="sub greenText">P1.2: Module relay + actuator</text>
  <rect x="70" y="585" width="230" height="62" rx="5" class="soft" stroke="#3b8f20"/>
  <rect x="82" y="597" width="24" height="24" rx="3" class="green"/><text x="94" y="615" text-anchor="middle" class="tag">T3</text>
  <text x="180" y="608" text-anchor="middle" class="body"><tspan x="180" dy="0">Lắp ráp relay, bơm *2,</tspan><tspan x="180" dy="22">quạt, phun sương, đèn LED</tspan></text>

