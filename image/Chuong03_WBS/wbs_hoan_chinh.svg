  <text x="173" y="722" text-anchor="middle" class="sub greenText">P1.3: Mô hình nhà kính</text>
  <rect x="70" y="755" width="230" height="62" rx="5" class="soft" stroke="#3b8f20"/>
  <rect x="82" y="767" width="24" height="24" rx="3" class="green"/><text x="94" y="785" text-anchor="middle" class="tag">T3</text>
