  <rect x="400" y="470" width="24" height="24" rx="3" class="blue"/><text x="412" y="488" text-anchor="middle" class="tag">T3</text>
  <text x="520" y="483" text-anchor="middle" class="body"><tspan x="520" dy="0">Lập trình kết nối</tspan><tspan x="520" dy="22">WiFi, gửi/nhận dữ liệu</tspan></text>
